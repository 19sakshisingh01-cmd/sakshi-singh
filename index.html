<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>HDFC Admin Panel</title>


<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    padding:30px;
}

.container{
    max-width:600px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.logo{
    width:220px;
    max-width:90%;
}

h2{
    text-align:center;
    color:#004b93;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    border:none;
    border-radius:5px;
    background:#004b93;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    opacity:0.9;
}

button:disabled{
    opacity:0.6;
    cursor:not-allowed;
}

#message{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}

</style>

</head>


<body>


<div style="display:flex;justify-content:center;">

    <img
        src="logo.png"
        class="logo"
        alt="HDFC Life"
    >

</div>


<div class="container">


<h2>HDFC Admin Panel</h2>


<label for="policy">
    Policy Number
</label>

<input
    type="text"
    id="policy"
    maxlength="8"
    placeholder="Enter 8 digit policy number"
>


<label for="customer">
    Customer Name
</label>

<input
    type="text"
    id="customer"
    placeholder="Enter customer name"
>


<label for="amount">
    Amount
</label>

<input
    type="number"
    id="amount"
    placeholder="Enter amount"
    min="1"
    step="0.01"
>


<label for="upi">
    UPI ID
</label>

<input
    type="text"
    id="upi"
    placeholder="example@upi"
>


<button
    id="generateBtn"
    type="button"
    onclick="generateLink()"
>
    Generate Payment Link
</button>


<label for="generatedLink">
    Generated Link
</label>

<input
    type="text"
    id="generatedLink"
    readonly
    placeholder="Generated link will appear here"
>


<button
    type="button"
    onclick="copyLink()"
>
    Copy Link
</button>


<div id="message"></div>


</div>


<script type="module">


import {

    db,
    doc,
    setDoc

} from "./firebase.js";



/*
==================================================
GENERATE PAYMENT LINK
==================================================
*/

window.generateLink = async function(){


    const btn =
        document.getElementById(
            "generateBtn"
        );


    const policy =
        document.getElementById(
            "policy"
        ).value.trim();


    const customer =
        document.getElementById(
            "customer"
        ).value.trim();


    const amount =
        document.getElementById(
            "amount"
        ).value.trim();


    const upi =
        document.getElementById(
            "upi"
        ).value.trim();


    const message =
        document.getElementById(
            "message"
        );


    /*
    Clear previous message
    */

    message.innerText = "";
    message.style.color = "";


    /*
    Validate fields BEFORE disabling button
    */

    if(
        !policy ||
        !customer ||
        !amount ||
        !upi
    ){

        message.innerText =
            "Please fill all fields.";

        message.style.color =
            "red";

        return;
    }


    /*
    Policy validation
    */

    if(!/^\d{8}$/.test(policy)){

        message.innerText =
            "Policy Number must be exactly 8 digits.";

        message.style.color =
            "red";

        return;
    }


    /*
    Amount validation
    */

    if(Number(amount) <= 0){

        message.innerText =
            "Please enter a valid amount.";

        message.style.color =
            "red";

        return;
    }


    /*
    Disable button while Firebase is saving
    */

    btn.disabled = true;

    btn.innerText =
        "Generating...";


    try{


        /*
        ==========================================
        CREATE RANDOM PRIVATE LINK ID
        ==========================================

        Example:

        HDF8K29X4P7M
        */

        const characters =
            "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";


        const randomValues =
            new Uint32Array(10);


        crypto.getRandomValues(
            randomValues
        );


        let token =
            "HDF";


        for(
            let i = 0;
            i < randomValues.length;
            i++
        ){

            token +=
                characters[
                    randomValues[i] %
                    characters.length
                ];

        }


        /*
        ==========================================
        SAVE DATA TO FIREBASE
        ==========================================

        The policy number is NOT the
        Firebase document ID.

        The random token is the document ID.
        */

        await setDoc(

            doc(
                db,
                "payments",
                token
            ),

            {

                policy: policy,

                customer: customer,

                amount: Number(amount),

                upi: upi

            }

        );


        /*
        ==========================================
        CREATE CUSTOMER LINK
        ==========================================

        IMPORTANT:

        The policy number is NOT included.

        Only the random token is visible.
        */

        const link =
            window.location.origin +
            "/admin.html?id=" +
            encodeURIComponent(token);


        /*
        Show generated link
        */

        document.getElementById(
            "generatedLink"
        ).value = link;


        message.innerText =
            "Payment link generated successfully.";

        message.style.color =
            "green";


        console.log(
            "Payment Link Generated:",
            link
        );


    }
    catch(error){


        console.error(
            "Firebase error:",
            error
        );


        message.innerText =
            "Unable to generate payment link: " +
            error.message;


        message.style.color =
            "red";


    }
    finally{


        btn.disabled = false;

        btn.innerText =
            "Generate Payment Link";


    }

};



/*
==================================================
COPY LINK
==================================================
*/

window.copyLink = async function(){


    const link =
        document.getElementById(
            "generatedLink"
        );


    const message =
        document.getElementById(
            "message"
        );


    if(!link.value){

        message.innerText =
            "Generate a payment link first.";

        message.style.color =
            "red";

        return;

    }


    try{


        await navigator.clipboard.writeText(
            link.value
        );


        message.innerText =
            "Payment link copied successfully.";

        message.style.color =
            "green";


    }
    catch(error){


        /*
        Fallback
        */

        link.select();

        document.execCommand(
            "copy"
        );


        message.innerText =
            "Payment link copied.";

        message.style.color =
            "green";
    }

};
console.log("ADMIN JAVASCRIPT LOADED");
</script>
</body>

</html>
